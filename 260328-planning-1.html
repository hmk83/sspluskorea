            <div class="bg-gray-50 p-3 rounded mb-4 text-center"><p class="text-sm text-gray-500">납부할 세액</p><p class="text-xl font-bold text-gray-900">125,000원</p></div>
            <button class="mt-auto w-full py-2 bg-purple-600 text-white rounded font-bold">납부서 PDF 다운로드</button>
          </div>
        </div>
      </div>
    `);

    const clientStep4 = wrapClientDetail('step4', `
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col flex-1 overflow-hidden h-[600px]">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
          <div><h2 class="text-xl font-bold text-gray-900">초정밀 임직원 급여 내역 확인 및 이체</h2><p class="text-sm text-gray-500 mt-1">상세 급여 항목을 검증하고 이체용 엑셀을 추출합니다.</p></div>
          <button class="px-4 py-2 border border-gray-300 bg-white text-gray-700 rounded font-bold text-sm flex gap-2 items-center"><i data-lucide="download" class="w-4 h-4"></i> 은행 일괄 이체용 엑셀 추출</button>
        </div>
        <div class="p-6 border-b border-gray-200 bg-white"><div class="grid grid-cols-4 gap-6"><div><p class="text-xs text-gray-500 font-bold mb-1">총 인원</p><p class="text-2xl font-bold text-slate-800">5명</p></div><div><p class="text-xs text-gray-500 font-bold mb-1">총 지급액 합계</p><p class="text-2xl font-bold text-blue-700">19,500,000원</p></div><div><p class="text-xs text-gray-500 font-bold mb-1">총 공제액 합계</p><p class="text-2xl font-bold text-red-600">-1,820,000원</p></div><div class="pl-6 border-l-2 border-emerald-500"><p class="text-xs text-emerald-600 font-bold mb-1">실지급액 (이체필요금액)</p><p class="text-2xl font-bold text-emerald-700">17,680,000원</p></div></div></div>
        <div class="overflow-x-auto flex-1 bg-white">
          <table class="min-w-max w-full divide-y divide-gray-200 whitespace-nowrap text-xs"><thead class="bg-slate-100 sticky top-0"><tr><th class="px-3 py-3 text-left font-bold text-gray-600">사번/부서</th><th class="px-3 py-3 text-left font-bold text-gray-600">성명</th><th class="px-3 py-3 text-right font-bold text-gray-600 bg-blue-50">기본급</th><th class="px-3 py-3 text-right font-bold text-blue-800 bg-blue-100">지급총액</th><th class="px-3 py-3 text-right font-bold text-gray-600 bg-red-50">국민연금</th><th class="px-3 py-3 text-right font-bold text-gray-600 bg-red-50">건강보험</th><th class="px-3 py-3 text-right font-bold text-red-800 bg-red-100">공제총액</th><th class="px-3 py-3 text-right font-bold text-emerald-800 bg-emerald-50">차인지급액</th></tr></thead>
          <tbody class="divide-y divide-gray-200">${clientEmployees.map(emp => `<tr><td class="px-3 py-3 border-r font-bold">${emp.name}</td><td class="px-3 py-3 font-bold border-r">${emp.dept}</td><td class="px-3 py-3 text-right">${formatCurrency(emp.basePay)}</td><td class="px-3 py-3 text-right font-bold text-blue-700 bg-blue-50/30">${formatCurrency(emp.basePay + 200000)}</td><td class="px-3 py-3 text-right text-red-500">${formatCurrency(emp.natPen)}</td><td class="px-3 py-3 text-right text-red-500">${formatCurrency(emp.hlthIns)}</td><td class="px-3 py-3 text-right font-bold text-red-600 bg-red-50/30">-</td><td class="px-3 py-3 text-right font-bold text-emerald-700 bg-emerald-50/50">-</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    `);

    // --- DRAW CANVAS RENDERER ---
    function drawCanvas() {
      const container = document.getElementById('flow-container');

      const buildRow = (title, items) => {
        let rowHtml = `<div class="mb-8"><h2 class="text-3xl font-extrabold text-slate-700 pl-4 border-l-8 border-blue-500">${title}</h2></div><div class="flex gap-20 items-center justify-start">`;

        items.forEach((item, index) => {
          rowHtml += createFrame(item.title, item.desc, item.html, item.overlay);
          if (index < items.length - 1) rowHtml += createArrow();
        });

        rowHtml += `</div>`;
        return rowHtml;
      };

      let output = '';

      // ROW 1
      output += buildRow('1. 온보딩 및 초기 설정', [
        { title: '1-1. 세무대리인 로그인', desc: '시스템 진입', html: screenLogin },
        { title: '1-2. 세무대리인 회원가입', desc: '초기 세팅', html: screenSignup },
        { title: '1-3. 설정 및 임직원 관리', desc: '위하고 연동 마스터 설정', html: screenSettings }
      ]);
      output += createDownArrow('이후 세무대리인 전용 업무 시작');

      // ROW 2
      output += buildRow('2. 세무대리인 기초 업무 자동화', [
        { title: '2-1. 수임처 일괄 관리', desc: '위하고 연동 및 계정 생성', html: screenClients },
        { title: '2-2. 원천징수 일괄 자료요청', desc: '수임처 선택 후 자동 요청/스크래핑', html: screenWithholding },
        { title: '2-3. [진행중 모달]', desc: '스크래핑 자동 대사 시뮬레이션', html: screenWithholding, overlay: overlayScraping },
        { title: '2-4. [수동 검토 모달]', desc: '예외(고객 수정) 발생 건 리뷰', html: screenWithholding, overlay: overlayReview }
      ]);
      output += createDownArrow('위하고 최종 업로드 후 수임처 포털로 전달');

      // ROW 3
      output += buildRow('3. 수임처(고객사) 전용 소통 포털 (Client Portal)', [
        { title: '3-1. 수임처 메인 게시판', desc: '월별 업무 진척도 아카이브', html: screenClientBoard },
        { title: '3-2. 기초 자료 제출 듀얼 패스', desc: '이상 없음 즉시확인 OR 수정 엑셀 업로드', html: clientStep1 },
        { title: '3-3. 확정 급여대장 승인', desc: '최종 급여 내역 확인 및 승인', html: clientStep2 },
        { title: '3-4. 세금 납부서 확인', desc: '국세 및 지방세 납부서 개시 확인', html: clientStep3 },
        { title: '3-5. 임직원 급여 내역 확인', desc: '세분화된 급여 데이터 및 이체용 엑셀 다운', html: clientStep4 }
      ]);
      output += createDownArrow('수임처 최종 승인 후 세무대리인 마감 업무');

      // ROW 4
      output += buildRow('4. 세무대리인 최종 마감 및 신고', [
        { title: '4-1. 확정 급여대장 관리', desc: '위하고에서 최종 DB 다운로드 및 일괄 전송', html: screenPayroll },
        { title: '4-2. 신고 및 납부서 일괄 개시', desc: '홈택스 자동신고 및 납부서 고객사 개시', html: screenTaxReport }
      ]);

      container.innerHTML = output;
      lucide.createIcons();
    }

    // --- ZOOM & PAN LOGIC ---
    let currentScale = 1;

    function updateZoom() {
      const contentEl = document.getElementById('canvas-content');
      const zoomLabel = document.getElementById('zoom-level');
      if (contentEl && zoomLabel) {
        contentEl.style.transform = `scale(${currentScale})`;
        zoomLabel.innerText = Math.round(currentScale * 100) + '%';
      }
    }

    function zoomIn() {
      currentScale = Math.min(currentScale * 1.2, 3); // 최대 300%
      updateZoom();
    }

    function zoomOut() {
      currentScale = Math.max(currentScale / 1.2, 0.1); // 최소 10%
      updateZoom();
    }

    function fitToScreen() {
      const contentEl = document.getElementById('canvas-content');
      if (!contentEl) return;

      const rawWidth = contentEl.scrollWidth;
      const rawHeight = contentEl.scrollHeight;

      // 여백 (UI 공간 및 시각적 안정감을 위해)
      const paddingX = 200;
      const paddingY = 200;

      const scaleX = (window.innerWidth - paddingX) / rawWidth;
      const scaleY = (window.innerHeight - paddingY) / rawHeight;

      currentScale = Math.min(scaleX, scaleY);

      updateZoom();

      // 스크롤 초기화
      const canvas = document.getElementById('figma-canvas');
      if (canvas) {
        canvas.scrollLeft = 0;
        canvas.scrollTop = 0;
      }
    }

    // Initialize Canvas drawing
    drawCanvas();

    // 화면 렌더링 직후 fitToScreen 실행
    setTimeout(() => {
      fitToScreen();
    }, 50);

    // Canvas dragging logic
    const canvas = document.getElementById('figma-canvas');
    let isDown = false;
    let startX;
    let startY;
    let scrollLeft;
    let scrollTop;

    canvas.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - canvas.offsetLeft;
      startY = e.pageY - canvas.offsetTop;
      scrollLeft = canvas.scrollLeft;
      scrollTop = canvas.scrollTop;
    });
    canvas.addEventListener('mouseleave', () => { isDown = false; });
    canvas.addEventListener('mouseup', () => { isDown = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - canvas.offsetLeft;
      const y = e.pageY - canvas.offsetTop;
      const walkX = (x - startX) * 2;
      const walkY = (y - startY) * 2;
      canvas.scrollLeft = scrollLeft - walkX;
      canvas.scrollTop = scrollTop - walkY;
    });

    // 마우스 휠(Ctrl/Cmd)을 통한 확대/축소 지원
    canvas.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        if (e.deltaY > 0) zoomOut();
        else zoomIn();
      }
    }, { passive: false });

  </script>
