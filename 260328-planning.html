    function startRequestProcess() {
      const modalHtml = `

            <div class="p-6 space-y-4 bg-gray-50" id="scraping-steps">
              <!-- Steps injected here -->
            </div>
            <div class="p-5 border-t bg-white flex justify-end" id="scraping-footer">
              <button disabled class="px-6 py-2 bg-gray-200 text-gray-500 rounded font-bold flex gap-2 items-center"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 일괄 처리중</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = modalHtml;

      const updateSteps = (step) => {
        const steps = [
          { n: 1, t: '요청 상태 전환', s: '수임처 담당자에게 알림 발송 중...' },
          { n: 2, t: '수신 상태 전환', s: '스크래핑 대사 및 고객사 업로드 시뮬레이션...' },
          { n: 3, t: '확인 상태로 자동 검증', s: '예외 발생 건(수신 대기)을 제외하고 모두 확인 처리됩니다.' },
        ];

        const stepsContainer = document.getElementById('scraping-steps');
        if (stepsContainer) {
          stepsContainer.innerHTML = steps.map(st => `
              <div class="flex items-start gap-4 p-4 rounded-lg border ${step === st.n ? 'bg-blue-50 border-blue-200' : step > st.n ? 'bg-white border-gray-200' : 'opacity-50'}">
                ${step > st.n ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-500"></i>' : step === st.n ? '<i data-lucide="loader-2" class="w-6 h-6 text-blue-600 animate-spin"></i>' : `<div class="w-6 h-6 rounded-full border-2 border-gray-300 text-center text-sm font-bold text-gray-400 leading-5">${st.n}</div>`}
                <div><h4 class="font-bold ${step === st.n ? 'text-blue-900' : 'text-gray-800'}">${st.t}</h4><p class="text-sm text-gray-500 mt-1">${st.s}</p></div>
              </div>
            `).join('');
          lucide.createIcons();
        }
      };

      updateSteps(0);

      setTimeout(() => {
        updateSteps(1);
        clients.forEach(c => { if (selectedIds.includes(c.id)) c.w_status = '요청'; });
      }, 1000);

      setTimeout(() => {
        updateSteps(2);
        clients.forEach(c => { if (selectedIds.includes(c.id)) c.w_status = '수신'; });
      }, 2500);

      setTimeout(() => {
        updateSteps(3);
        clients.forEach(c => {
          if (!selectedIds.includes(c.id)) return;
          if (c.id === 2) { c.w_status = '수신'; c.w_excelData = `202604_급여대장_${c.name}_수정.xlsx`; c.w_edited = true; }
          else { c.w_status = '확인'; c.w_excelData = `202604_급여대장_${c.name}.xlsx`; c.w_edited = false; }
        });

        setTimeout(() => {
          document.getElementById('modal-container').innerHTML = '';
          showToast('일괄 자료 요청 및 대사가 완료되었습니다. 이상 건을 제외하고 자동 확인 처리되었습니다.');
          render();
        }, 1500);
      }, 4000);
    }

    function openReviewModal(id) {
      const client = clients.find(c => c.id === id);
      reviewClientId = id;
      const modalHtml = `
        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">자료(급여) 엑셀 확인 및 검토</h3>
              <button onclick="document.getElementById('modal-container').innerHTML = ''"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <div class="p-6 space-y-5">
              <p class="font-bold text-lg text-gray-900">${client.name}</p>
              <button class="w-full flex justify-between items-center p-4 border rounded-lg hover:bg-blue-50 transition-colors">
                <div class="flex gap-3 items-center"><i data-lucide="file-text" class="w-5 h-5 text-blue-600"></i><span class="font-medium text-gray-800">${client.w_excelData}</span></div>
                <i data-lucide="download" class="w-5 h-5 text-gray-400"></i>
              </button>
              <div class="bg-slate-50 p-3 rounded border text-sm text-gray-600">
                <p class="font-bold mb-1">진행 로그</p>
                <p>• 세무대리인 일괄 자료 요청 발송 완료</p>
                <p>• 수임처 소통포털을 통한 수정본 엑셀 업로드 (수신)</p>
              </div>
            </div>
            <div class="p-5 border-t bg-gray-50 flex justify-end gap-3">
              <button onclick="handleRejectReview()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded font-bold hover:bg-gray-100">재요청 (수정요청)</button>
              <button onclick="handleConfirmReview()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> 이상 없음 (확인)</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = modalHtml;
      lucide.createIcons();
    }

    function handleRejectReview() {
      const client = clients.find(c => c.id === reviewClientId);
      client.w_status = '요청';
      client.w_edited = false;
      document.getElementById('modal-container').innerHTML = '';
      showToast('해당 수임처에 엑셀 재수정 요청을 발송했습니다.');
      render();
    }

    function handleConfirmReview() {
      const client = clients.find(c => c.id === reviewClientId);
      client.w_status = '확인';
      client.w_edited = false;
      document.getElementById('modal-container').innerHTML = '';
      showToast('수동 검토가 완료되어 확인 상태로 변경되었습니다.');
      render();
    }

    function startWehagoUpload() {
      showToast('위하고 일괄 자동 업로드가 백그라운드에서 진행됩니다.');
      setTimeout(() => {
        clients.forEach(c => { if (c.w_status === '확인') c.w_status = '업로드완료'; });
        showToast('확인 완료 건이 위하고에 성공적으로 업로드되어 다음 단계(급여대장)로 연동됩니다.');
        render();
      }, 3000);
    }

    function startConversion() {
      showToast('위하고에서 급여대장을 일괄 다운로드하여 디테일하게 DB에 변환 저장했습니다.');
      clients.forEach(c => { if (selectedIds.includes(c.id)) c.p_status = 'DB변환완료'; });
      selectedIds = [];
      render();
    }

    function sendToClient() {
      showToast('수임처 포털로 확정 급여대장 전달이 완료되어 신고 메뉴로 연동됩니다.');
      clients.forEach(c => { if (selectedIds.includes(c.id)) c.p_status = '요청(전달)'; });
      selectedIds = [];
      render();
    }

    function reportToTax() {
      showToast('다수의 수임처 홈택스/위택스 자동 신고 접수가 일괄 완료되었습니다.');
      clients.forEach(c => { if (selectedIds.includes(c.id)) c.t_status = '신고완료/납부서준비'; });
      selectedIds = [];
      render();
    }

    function postPaymentSlip() {
      showToast('선택된 수임처 포털에 납부서 개시가 일괄 완료되었습니다.');
      clients.forEach(c => { if (selectedIds.includes(c.id)) c.t_status = '납부서개시완료'; });
      selectedIds = [];
      render();
    }

    // Client Actions
    function handleDirectConfirm() {
      const record = portalRecords.find(r => r.id === selectedPortalRecordId);
      record.isSubmitted = true;
      showToast('초안 내역에 이상 없음으로 즉시 확인 및 제출되었습니다.');
      render();
    }

    function handlePortalSubmit() {
      const record = portalRecords.find(r => r.id === selectedPortalRecordId);
      record.isSubmitted = true;
      showToast('수정된 엑셀 급여대장이 성공적으로 제출되었습니다.');
      render();
    }

    function handlePortalApprove() {
      const record = portalRecords.find(r => r.id === selectedPortalRecordId);
      record.isApproved = true;
      showToast('확정 급여대장이 승인 처리되었습니다. 세무대리인이 원천세 신고를 진행합니다.');
      render();
    }

    // Employee Modals
    function openEmpModal() {
      const modalHtml = `
        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
            <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
              <h3 class="text-lg font-bold text-gray-800">임직원 추가 및 WEHAGO 연동</h3>
              <button onclick="document.getElementById('modal-container').innerHTML = ''"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <form id="emp-form" onsubmit="submitEmpForm(event)" class="p-6 space-y-4">
              <div><label class="block text-sm font-bold text-gray-700 mb-1">이름</label><input required type="text" value="박과장" class="w-full border border-gray-300 rounded p-2" /></div>
              <div><label class="block text-sm font-bold text-gray-700 mb-1">아이디</label><input required type="text" value="park_tax" class="w-full border border-gray-300 rounded p-2" /></div>
              <div><label class="block text-sm font-bold text-gray-700 mb-1">비밀번호</label><input required type="password" value="password123!" class="w-full border border-gray-300 rounded p-2" /></div>
              <div><label class="block text-sm font-bold text-gray-700 mb-1">휴대폰 번호</label><input required type="text" value="010-9999-8888" class="w-full border border-gray-300 rounded p-2" /></div>
              <div class="border-t pt-4 mt-2">
                <label class="block text-sm font-bold text-blue-700 mb-1 flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4"></i> 직원 WEHAGO 계정</label>
                <div class="space-y-3">
                  <input required type="text" value="park_wehago" class="w-full border border-gray-300 rounded p-2" />
                  <input required type="password" value="wehago123!" class="w-full border border-gray-300 rounded p-2" />
                </div>
              </div>
              <div class="pt-4 flex justify-end gap-2" id="emp-form-footer">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="px-4 py-2 border rounded font-bold text-gray-600">취소</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded font-bold flex items-center gap-2">등록 및 검증</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = modalHtml;
      lucide.createIcons();
    }

    function submitEmpForm(e) {
      e.preventDefault();
      const footer = document.getElementById('emp-form-footer');
      footer.innerHTML = `<button disabled class="px-4 py-2 bg-blue-600 text-white rounded font-bold flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> WEHAGO 검증 중</button>`;
      lucide.createIcons();

      setTimeout(() => {
        document.getElementById('modal-container').innerHTML = '';
        employees.push({ id: Date.now(), name: '박과장', empId: 'park_tax', phone: '010-9999-8888', role: '일반직원' });
        showToast('WEHAGO 계정 검증 완료. 임직원이 정상적으로 추가되었습니다.');
        render();
      }, 1500);
    }

    function testWehago(btn) {
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 인증 테스트 실행`;
      lucide.createIcons();

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        showToast('위하고 연동 인증 테스트에 성공했습니다.');
        lucide.createIcons();
      }, 2000);
    }

    // --- INITIALIZATION ---
    render();

  </script>
</body>

</html>
