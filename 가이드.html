<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쉽다쉬워 업무 프로세스 가이드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Mermaid.js for Mindmap/Flowchart -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    /* 애니메이션 유틸리티 */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    .slide-up {
      animation: slideUp 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 마인드맵 컨테이너 조작 커서 스타일 */
    .mermaid-container {
      cursor: grab;
    }

    .mermaid-container:active {
      cursor: grabbing;
    }

    /* 플로우차트 화살표 진행 방향 애니메이션 */
    .edgePath .path {
      stroke-dasharray: 6 4 !important;
      animation: flowDash 0.5s linear infinite !important;
    }

    @keyframes flowDash {
      to {
        stroke-dashoffset: -10;
      }
    }
  </style>
</head>

<body class="h-screen overflow-hidden text-slate-800">

      update: function () {
        render();
        if (this.viewMode === 'MAP') {
          // 렌더링 후 DOM 업데이트 대기를 위해 약간의 지연 후 Mermaid 실행
          setTimeout(() => {
            const mermaidDiv = document.querySelector('.mermaid');
            if (mermaidDiv) {
              mermaidDiv.removeAttribute('data-processed');
              mermaid.run({ querySelector: '.mermaid' }).then(() => {
                const svg = mermaidDiv.querySelector('svg');
                const container = document.querySelector('.mermaid-container');
                if (svg && container) {
                  // SVG 크기를 부모 컨테이너에 100% 꽉 차도록 설정
                  svg.style.width = '100%';
                  svg.style.height = '100%';
                  svg.style.maxWidth = 'none';
                  svg.style.transformOrigin = '0 0';

                  // 외부 라이브러리(svg-pan-zoom) 대신 순수 Vanilla JS Pan & Zoom 구현
                  let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0;

                  const updateTransform = () => {
                    svg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
                  };

                  container.onmousedown = function (e) {
                    e.preventDefault();
                    panning = true;
                    startX = e.clientX - pointX;
                    startY = e.clientY - pointY;
                    container.style.cursor = 'grabbing';
                  };

                  container.onmouseup = container.onmouseleave = function () {
                    panning = false;
                    container.style.cursor = 'grab';
                  };

                  container.onmousemove = function (e) {
                    if (!panning) return;
                    pointX = e.clientX - startX;
                    pointY = e.clientY - startY;
                    updateTransform();
                  };

                  container.onwheel = function (e) {
                    e.preventDefault();
                    svg.style.transition = 'none';
                    const rect = container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const wheel = e.deltaY < 0 ? 1 : -1;
                    const zoomTarget = scale * Math.exp(wheel * 0.15);
                    const newScale = Math.max(0.2, Math.min(zoomTarget, 5));

                    pointX = mouseX - (mouseX - pointX) * (newScale / scale);
                    pointY = mouseY - (mouseY - pointY) * (newScale / scale);
                    scale = newScale;

                    updateTransform();
                  };

                  window.panZoomInstance = {
                    zoomIn: () => { svg.style.transition = 'transform 0.2s ease-out'; scale = Math.min(scale * 1.3, 5); updateTransform(); },
                    zoomOut: () => { svg.style.transition = 'transform 0.2s ease-out'; scale = Math.max(scale / 1.3, 0.2); updateTransform(); },
                    fit: () => { svg.style.transition = 'transform 0.2s ease-out'; scale = 1; pointX = 0; pointY = 0; updateTransform(); }
                  };

                  // 부드러운 페이드인 효과 적용
                  mermaidDiv.classList.remove('opacity-0');
                }
              }).catch(e => console.error(e));
            }
          }, 50);
        }

                  onclick="setFlow(${index})"
                  class="w-full text-left p-3 rounded-xl transition-all flex flex-col gap-1 relative overflow-hidden group
                    ${isActive ? `bg-slate-800 border border-slate-700 shadow-md` : `hover:bg-slate-800/50 border border-transparent`}"
                >
                  ${isActive ? `<div class="absolute left-0 top-0 w-1 h-full bg-${flow.color}-500"></div>` : ''}
                  <div class="flex items-center gap-2.5 pl-1.5">
                    <div class="p-1.5 rounded-lg ${isActive ? `bg-${flow.color}-500/20 text-${flow.color}-400` : `bg-slate-800 text-slate-400 group-hover:text-slate-300`}">
                      <i data-lucide="${flow.icon}" class="w-4 h-4"></i>
                    </div>
                    <span class="font-bold text-sm ${isActive ? 'text-white' : 'text-slate-400 group-hover:text-white'} truncate">${flow.title}</span>
                  </div>
                </button>
              `;
      }).join('')}
          </div>
        </aside>
      `;
    };

    // 2. 우측 메인 콘텐츠
    const renderMainContent = () => {
      const flow = FLOWS[appState.activeFlowIndex];
      const isMapMode = appState.viewMode === 'MAP';

      const colorMap = {
        violet: { bg: 'bg-violet-50', text: 'text-violet-600', border: 'border-violet-200', activeBg: 'bg-violet-600', hover: 'hover:bg-violet-700' },
        indigo: { bg: 'bg-indigo-50', text: 'text-indigo-600', border: 'border-indigo-200', activeBg: 'bg-indigo-600', hover: 'hover:bg-indigo-700' },
        emerald: { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', activeBg: 'bg-emerald-600', hover: 'hover:bg-emerald-700' },
        blue: { bg: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-200', activeBg: 'bg-blue-600', hover: 'hover:bg-blue-700' },
        rose: { bg: 'bg-rose-50', text: 'text-rose-600', border: 'border-rose-200', activeBg: 'bg-rose-600', hover: 'hover:bg-rose-700' }
      };
      const theme = colorMap[flow.color];

      return `
        <main class="flex-1 flex flex-col h-full bg-slate-50 overflow-hidden relative">
          
          <header class="bg-white px-8 py-5 border-b border-slate-200 shadow-sm z-10 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl ${theme.bg} ${theme.text} flex items-center justify-center shadow-inner">
                <i data-lucide="${flow.icon}" class="w-6 h-6"></i>
              </div>
              <div>
                <h2 class="text-xl font-black text-slate-900 tracking-tight">${flow.title}</h2>
                <p class="text-slate-500 mt-0.5 text-xs font-medium truncate max-w-lg">${flow.desc}</p>
              </div>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button onclick="setViewMode('STEP')" class="px-4 py-1.5 text-xs font-bold rounded-md flex items-center gap-1.5 transition-all ${!isMapMode ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i> 단계별 보기
              </button>
              <button onclick="setViewMode('MAP')" class="px-4 py-1.5 text-xs font-bold rounded-md flex items-center gap-1.5 transition-all ${isMapMode ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                <i data-lucide="network" class="w-3.5 h-3.5"></i> 마인드맵
              </button>
            </div>
          </header>

          <!-- 뷰 모드에 따라 패딩(여백)과 스크롤 속성을 동적으로 변경하여 마인드맵 영역을 극대화 -->
          <div class="flex-1 flex flex-col ${isMapMode ? 'p-4 overflow-hidden' : 'p-8 overflow-y-auto'}">
            ${isMapMode ? renderMapContent(flow) : renderStepContent(flow, theme)}
          </div>
        </main>
      `;
    };

    // 2-1. 단계별 뷰
    const renderStepContent = (flow, theme) => {
      const step = flow.steps[appState.activeStepIndex];
      const totalSteps = flow.steps.length;
      const isFirst = appState.activeStepIndex === 0;
      const isLast = appState.activeStepIndex === totalSteps - 1;

      return `
        <div class="max-w-5xl mx-auto w-full mb-8 fade-in">
          <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 rounded-full z-0"></div>
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-1 ${theme.activeBg} rounded-full z-0 transition-all duration-500" style="width: ${(appState.activeStepIndex / (totalSteps - 1)) * 100}%"></div>
            
            ${flow.steps.map((s, i) => {
        const isPast = i < appState.activeStepIndex;
        const isCurrent = i === appState.activeStepIndex;
        return `
                <button onclick="setStep(${i})" class="relative z-10 flex flex-col items-center gap-2 group outline-none">
                  <div class="w-10 h-10 rounded-full border-[3px] flex items-center justify-center font-bold text-sm transition-all duration-300
                    ${isCurrent ? `${theme.border} ${theme.activeBg} text-white shadow-md scale-110` :
            isPast ? `${theme.border} ${theme.activeBg} text-white` : `border-slate-200 bg-white text-slate-400 group-hover:border-slate-300`}">
                    ${isPast ? `<i data-lucide="check" class="w-4 h-4"></i>` : (i + 1)}
                  </div>
                  <span class="absolute -bottom-6 w-24 text-center text-[10px] font-bold ${isCurrent ? 'text-slate-900' : 'text-slate-400'}">STEP ${i + 1}</span>
                </button>
              `;
      }).join('')}
          </div>
        </div>

        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-start mt-4 slide-up" key="${flow.id}-${appState.activeStepIndex}">
          <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="${theme.bg} px-8 py-6 border-b ${theme.border} flex items-center gap-3">
              <div class="p-2.5 bg-white rounded-lg shadow-sm ${theme.text}"><i data-lucide="${step.icon}" class="w-5 h-5"></i></div>
              <div>
                <span class="text-[10px] font-black ${theme.text} tracking-widest uppercase mb-0.5 block">Step ${appState.activeStepIndex + 1}</span>
                <h3 class="text-xl font-black text-slate-900">${step.title}</h3>
              </div>
            </div>
            
            <div class="p-8 space-y-6">
              <p class="text-base text-slate-600 font-medium bg-slate-50 p-5 rounded-2xl border border-slate-100">${step.desc}</p>
              
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <h4 class="flex items-center gap-2 font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100 text-sm">
                    <i data-lucide="keyboard" class="w-4 h-4 text-slate-400"></i> 무엇을 입력/확인하나요?
                  </h4>
                  <ul class="space-y-2">
                    ${step.inputs.map(input => `
                      <li class="flex items-start gap-2 text-sm text-slate-600 leading-relaxed">
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300 mt-1 shrink-0"></i>
                        <span class="font-medium">${input}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
                
                <div>
                  <h4 class="flex items-center gap-2 font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100 text-sm">
                    <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-slate-400"></i> 어떤 행동을 하나요?
                  </h4>
                  <ul class="space-y-2">
                    ${step.actions.map(action => `
                      <li class="flex items-start gap-2 text-sm text-slate-600 leading-relaxed">
                        <div class="w-1.5 h-1.5 rounded-full ${theme.activeBg} mt-1.5 shrink-0"></div>
                        <span class="font-medium">${action}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>

              <div class="mt-6 pt-5 border-t border-dashed border-slate-200">
                 <h4 class="flex items-center gap-2 font-bold text-slate-800 mb-2 text-sm">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> 처리 결과
                  </h4>
                  <p class="text-slate-700 font-bold bg-slate-100 inline-block px-4 py-2 rounded-lg text-sm leading-relaxed">${step.result}</p>
              </div>
            </div>
          </div>

          <div class="flex justify-between mt-6">
            <button 
              onclick="prevStep()" 
              class="px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${isFirst ? 'opacity-0 pointer-events-none' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 shadow-sm'}"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i> 이전 단계
            </button>
            <button 
              onclick="nextStep()" 
              class="px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-md text-white ${theme.activeBg} ${theme.hover} active:scale-95 ${isLast ? 'opacity-0 pointer-events-none' : ''}"
            >
              다음 단계 <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    };

    // 2-2. 마인드맵 뷰 및 토글 버튼
    const renderMapContent = (flow) => {
      const isClient = appState.mapType === 'CLIENT';

      return `
        <div class="w-full h-full flex flex-col fade-in relative">
          <div class="mb-3 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0">
            <div>
              <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                <i data-lucide="network" class="w-5 h-5 text-slate-500"></i> 전체 프로세스 마인드맵
              </h3>
              <p class="text-xs text-slate-500 mt-1">마우스 스크롤로 확대/축소하고, 캔버스를 드래그하여 이동할 수 있습니다.</p>
            </div>
            
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 w-fit">
              <button onclick="setMapType('CLIENT')" class="px-4 py-1.5 text-xs font-bold rounded-md flex items-center gap-1.5 transition-all ${isClient ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                <i data-lucide="users" class="w-3.5 h-3.5"></i> 간략 버전
              </button>
              <button onclick="setMapType('TECH')" class="px-4 py-1.5 text-xs font-bold rounded-md flex items-center gap-1.5 transition-all ${!isClient ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                <i data-lucide="code" class="w-3.5 h-3.5"></i> 상세 버전
              </button>
            </div>
          </div>
          
          <div class="flex-1 border border-slate-200 shadow-inner relative w-full bg-white rounded-3xl overflow-hidden group">
            
            <!-- 조작 안내 오버레이 -->
            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-2 rounded-xl border border-slate-200 shadow-sm text-xs font-bold text-slate-600 flex items-center gap-2 z-10 pointer-events-none">
                <i data-lucide="mouse" class="w-4 h-4 text-blue-500"></i> 스크롤 <span class="text-slate-400">|</span> 드래그 이동
            </div>

            <!-- 커스텀 확대/축소/맞춤 컨트롤러 -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-2 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <button onclick="window.panZoomInstance?.zoomIn()" class="w-10 h-10 bg-white rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all active:scale-95" title="확대">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="window.panZoomInstance?.zoomOut()" class="w-10 h-10 bg-white rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all active:scale-95" title="축소">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button onclick="window.panZoomInstance?.fit(); window.panZoomInstance?.center();" class="w-10 h-10 bg-white rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all active:scale-95" title="화면 맞춤">
                    <i data-lucide="maximize" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 마인드맵 렌더링 컨테이너 -->
            <div class="mermaid-container w-full h-full">
                <pre class="mermaid m-0 w-full h-full opacity-0 transition-opacity duration-500 flex items-center justify-center">
${isClient ? flow.mermaidClient : flow.mermaidTech}
                </pre>
            </div>
          </div>
        </div>
      `;
    };

    // --- Main Render Engine ---
    function render() {
      const appDiv = document.getElementById('app');

      appDiv.innerHTML = `
        <div class="flex h-full w-full">
          ${renderSidebar()}
          ${renderMainContent()}
        </div>
      `;

      lucide.createIcons();
    }

    // 초기 렌더링 시작
    render();
  </script>
</body>

</html>
